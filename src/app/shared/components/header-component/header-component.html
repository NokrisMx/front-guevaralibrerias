<nav class="sticky top-0 z-50 w-full bg-primary">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2 group">
        <span class="text-2xl leading-none"
          style="font-family:'Cormorant Garamond',serif; color:#b8975a; font-style:italic; letter-spacing:-0.5px">Guevara</span>
        <span class="hidden sm:block text-white font-medium tracking-wide text-sm">Librerías</span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-6">
        <a routerLink="/" routerLinkActive="opacity-100" [routerLinkActiveOptions]="{exact:true}"
          class="text-white/70 hover:text-white text-sm transition-colors">Inicio</a>
        <a routerLink="/books" routerLinkActive="text-white" [routerLinkActiveOptions]="{exact:false}"
          class="text-white/70 hover:text-white text-sm transition-colors">Libros</a>
        <a routerLink="/faqs" class="text-white/70 hover:text-white text-sm transition-colors">Faqs</a>
      </div>

      <!-- Right icons -->
      <div class="flex items-center gap-3">
        <a routerLink="/auth/profile"
          class="hidden md:flex items-center gap-1.5 text-white/70 hover:text-white text-sm transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Cuenta
        </a>
        <a routerLink="/books/cart" class="relative flex items-center text-white/70 hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          @if (cartCount() > 0) {
          <span
            class="absolute -top-2 -right-2 w-4 h-4 rounded-full text-[10px] font-medium flex items-center justify-center text-white"
            style="background-color:#b8975a">{{cartCount()}}</span>
          }
        </a>
        <!-- Mobile hamburger -->
        <button (click)="toggleMobile()" class="md:hidden text-white/70 hover:text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (mobileOpen()) {
  <div class="md:hidden border-t border-white/10" style="background-color:#011a16">
    <div class="px-4 py-3 flex flex-col gap-3">
      <a routerLink="/" (click)="toggleMobile()" class="text-white/80 hover:text-white text-sm py-1">Inicio</a>
      <a routerLink="/books" (click)="toggleMobile()" class="text-white/80 hover:text-white text-sm py-1">Catálogo</a>
      <a routerLink="/orders" (click)="toggleMobile()" class="text-white/80 hover:text-white text-sm py-1">Mis
        Pedidos</a>
      <a routerLink="/admin" (click)="toggleMobile()" class="text-white/80 hover:text-white text-sm py-1">Admin</a>
      <a routerLink="/login" (click)="toggleMobile()" class="text-white/80 hover:text-white text-sm py-1">Iniciar
        Sesión</a>
    </div>
  </div>
  }
</nav>
