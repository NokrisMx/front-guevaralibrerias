<!-- Categories -->
<section class="py-16 bg-neutral-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-10">
      <p class="text-xs tracking-widest uppercase mb-2" style="color:#b8975a">Explorar</p>
      <h2 class="text-3xl font-light" style="font-family:'Cormorant Garamond',serif; color:#02332D">Categorías</h2>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
      @for(cat of productResource.value(); track cat.id){
      <!--Corregir enlace a libros seleccionando una categoria-->
      <a [routerLink]="['/books', cat.id]"
        class="bg-white p-5 text-center border border-neutral-100 hover:border-[#02332D]/30 hover:shadow-md transition-all cursor-pointer group rounded-sm">
        <div class="text-3xl mb-2"><i class="pi pi-book"></i></div>
        <p class="font-medium text-sm text-neutral-700 group-hover:text-[#02332D] transition-colors">{{cat.name}}
        </p>
      </a>
      }
    </div>
  </div>
</section>
