<!-- Featured Books -->
<section class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-end justify-between mb-10">
      <div>
        <p class="text-xs tracking-widest uppercase mb-2" style="color:#b8975a">Selección</p>
        <h2 class="text-3xl font-light" style="font-family:'Cormorant Garamond',serif; color:#02332D">Libros Destacados
        </h2>
      </div>
      <a routerLink="/books" class="text-sm text-[#02332D] hover:opacity-70 transition-opacity hidden sm:block">Ver
        todos →</a>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      @for (book of productResource.value()?.slice(0,4); track book.id) {
      <a [routerLink]="['/books', book.id]" class="group cursor-pointer">
        <div class="relative overflow-hidden rounded-sm mb-3 aspect-[3/4]" style="background:#f5f0e8">
          <img [src]="book.imgUrl" [alt]="book.title"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          <div class="absolute inset-0 bg-[#02332D]/0 group-hover:bg-[#02332D]/10 transition-all duration-300"></div>
        </div>
        <p class="text-xs text-neutral-400 mb-1">{{book.categoryName}}</p>
        <h3 class="font-medium text-sm text-neutral-800 group-hover:text-[#02332D] transition-colors leading-snug">
          {{book.title}}</h3>
        <p class="text-xs text-neutral-500 mt-0.5">{{book.authorName}}</p>
        <p class="font-medium text-sm mt-2" style="color:#02332D">${{book.price}} MXN</p>
      </a>
      }
    </div>
  </div>
</section>
