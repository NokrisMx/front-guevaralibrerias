<!-- Featured Books -->
<section class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-end justify-between mb-10">
      <div>
        <p class="text-xs tracking-widest uppercase mb-2" style="color:#b8975a">Selección</p>
        <h2 class="text-3xl font-light text-primary" style="font-family:'Cormorant Garamond',serif;">Libros Destacados
        </h2>
      </div>
      <a routerLink="/books" class="text-sm text-primary hover:opacity-70 transition-opacity hidden sm:block">Ver
        todos →</a>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      @if(bookResource.isLoading()) {

      @for(item of [1,2,3,4]; track item) {

      <div class="animate-pulse">

        <!-- Imagen -->
        <div class="skeleton rounded-sm mb-3 aspect-3/4 w-full"></div>

        <!-- Categoría -->
        <div class="skeleton h-3 w-16 mb-2"></div>

        <!-- Título -->
        <div class="space-y-2 mb-2">
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-3/4"></div>
        </div>

        <!-- Autor -->
        <div class="skeleton h-3 w-24 mb-3"></div>

        <!-- Precio -->
        <div class="skeleton h-4 w-20"></div>

      </div>

      }

      } @else {

      @for (book of booksFeatured(); track book.id) {

      <a [routerLink]="['/books', book.id]" class="group cursor-pointer">

        <div class="relative overflow-hidden rounded-sm mb-3 aspect-auto" style="background:#f5f0e8">

          <img [src]="book.imgUrl | bookImg" [alt]="book.title"
            class="w-full h-full object-scale-down group-hover:scale-105 transition-transform duration-500">

          <div class="absolute inset-0 bg-primary/0 group-hover:bg-primary/10 transition-all duration-300">
          </div>

        </div>

        <p class="text-xs text-neutral-400 mb-1">
          {{book.categoryName}}
        </p>

        <h3 class="font-medium text-sm text-neutral-800 group-hover:text-primary transition-colors leading-snug">

          {{book.title}}

        </h3>

        <p class="text-xs text-neutral-500 mt-0.5">
          {{book.authorName}}
        </p>

        <p class="font-medium text-sm mt-2 text-primary">
          {{book.price | currency: 'MXN':'symbol':'1.2-2'}}
        </p>

      </a>

      }

      }
    </div>
  </div>
</section>
