<!-- CTA Banner -->
<section class="relative overflow-hidden py-24" style="background-color:#02332D">

  <!-- Círculos decorativos de fondo -->
  <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full opacity-10"
    style="background: radial-gradient(circle, #b8975a, transparent)"></div>
  <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full opacity-10"
    style="background: radial-gradient(circle, #b8975a, transparent)"></div>

  <!-- Línea decorativa izquierda -->
  <div class="absolute left-0 top-0 h-full w-px opacity-20"
    style="background: linear-gradient(to bottom, transparent, #b8975a, transparent)"></div>

  <!-- Línea decorativa derecha -->
  <div class="absolute right-0 top-0 h-full w-px opacity-20"
    style="background: linear-gradient(to bottom, transparent, #b8975a, transparent)"></div>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">

    <!-- Ícono decorativo -->
    <div class="flex justify-center mb-6">
      <div class="w-12 h-px" style="background-color:#b8975a"></div>
      <div class="mx-4 w-2 h-2 rounded-full -mt-0.75" style="background-color:#b8975a"></div>
      <div class="w-12 h-px" style="background-color:#b8975a"></div>
    </div>

    <p class="text-xs tracking-widest uppercase mb-4" style="color:#b8975a">Únete a nosotros</p>

    <h2 class="text-5xl md:text-6xl font-light text-white mb-6 leading-tight"
      style="font-family:'Cormorant Garamond',serif; font-style:italic">
      Tu próxima gran<br>lectura te espera
    </h2>

    <p class="text-white/50 mb-10 text-base max-w-md mx-auto leading-relaxed">
      Accede a tu historial de pedidos, guarda tus favoritos y descubre ofertas exclusivas para miembros.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      @if (authService.authStatus() !== 'authenticated') {
      <a routerLink="/auth/login"
        class="px-10 py-3.5 text-sm font-medium tracking-widest uppercase transition-opacity hover:opacity-80"
        style="background-color:#b8975a; color:#02332D">
        Iniciar Sesión
      </a>
      <a routerLink="/auth/register"
        class="px-10 py-3.5 text-sm font-medium tracking-widest uppercase border transition-colors hover:bg-white/5"
        style="border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.7)">
        Crear Cuenta
      </a>
      } @else {
      <a routerLink="/auth/profile"
        class="px-10 py-3.5 text-sm font-medium tracking-widest uppercase transition-opacity hover:opacity-80"
        style="background-color:#b8975a; color:#02332D">
        Mi Perfil
      </a>
      <a routerLink="/books"
        class="px-10 py-3.5 text-sm font-medium tracking-widest uppercase border transition-colors hover:bg-white/5"
        style="border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.7)">
        Ver Catálogo
      </a>
      }
    </div>

    <!-- Separador inferior -->
    <div class="flex justify-center mt-12">
      <div class="w-12 h-px" style="background-color:#b8975a; opacity:0.4"></div>
    </div>

  </div>
</section>
