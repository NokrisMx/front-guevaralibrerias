<aside class="flex flex-col transition-all duration-300 min-h-screen sticky top-0 bg-primary"
  [class.w-64]="!collapsed()" [class.w-16]="collapsed()">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-4 py-5 border-b border-white/10">
    @if (!collapsed()) {
    <span class="text-xl font-light text-white"
      style="font-family:'Cormorant Garamond',serif; font-style:italic; color:#b8975a">
      Guevara
    </span>
    <span class="text-xs text-white/40 uppercase tracking-widest ml-1">Admin</span>
    } @else {
    <span class="text-xl mx-auto" style="color:#b8975a; font-family:'Cormorant Garamond',serif">G</span>
    }
  </div>

  <!-- Toggle -->
  <button (click)="toggle()"
    class="flex items-center justify-center py-2 border-b border-white/10 text-white/40 hover:text-white transition-colors">
    <i class="pi text-xs" [class.pi-angle-double-left]="!collapsed()" [class.pi-angle-double-right]="collapsed()"></i>
  </button>

  <!-- Nav -->
  <nav class="flex-1 py-4 space-y-0.5 px-2 overflow-y-auto">

    <!-- Página principal — fuera del bucle, navegación absoluta -->
    <a href="/"
      class="flex items-center gap-3 px-3 py-2.5 rounded-sm text-white/60 hover:text-white hover:bg-white/5 transition-all"
      [class.justify-center]="collapsed()">
      <i class="pi pi-home text-sm shrink-0"></i>
      @if (!collapsed()) {
      <span class="text-sm">Página principal</span>
      }
    </a>

    <div class="my-2 border-t border-white/10"></div>

    <!-- Resto de items del admin -->
    @for (item of navItems; track item.path) {
    <a [routerLink]="item.path" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 px-3 py-2.5 rounded-sm text-white/60 hover:text-white hover:bg-white/5 transition-all"
      [class.justify-center]="collapsed()">
      <i class="pi {{ item.icon }} text-sm shrink-0"></i>
      @if (!collapsed()) {
      <span class="text-sm">{{ item.label }}</span>
      }
    </a>
    }

  </nav>

  <!-- Footer -->
  <div class="px-2 py-4 border-t border-white/10">
    <button (click)="logout()"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-sm text-white/60 hover:text-red-400 transition-colors cursor-pointer"
      [class.justify-center]="collapsed()">
      <i class="pi pi-sign-out text-sm"></i>
      @if (!collapsed()) {
      <span class="text-sm">Cerrar sesión</span>
      }
    </button>
  </div>
</aside>
