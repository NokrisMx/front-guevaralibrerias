<table-component title="Autores" subtitle="Administración" [columns]="columns"
  [data]="authorsResource.value()?.data ?? []" [isLoading]="authorsResource.isLoading()" [showNew]="true"
  [showEdit]="true" [showDelete]="true" (onNew)="onNew()" (onEdit)="onEdit($event)" (onDelete)="onDelete($event)" />

<author-modal [isOpen]="modalOpen()" [mode]="modalMode()" [author]="selectedAuthor()" (onClose)="onModalClose()"
  (onSuccess)="onModalSuccess()" />
