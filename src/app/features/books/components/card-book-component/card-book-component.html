<a [routerLink]="['/books', book().id]"
  class="group bg-white border border-neutral-100 rounded-sm overflow-hidden hover:shadow-md transition-all">
  <div class="overflow-hidden">
    <img [src]="book().imgUrl || 'assets/images/no-image.jpg'" [alt]="book().title"
      class="h-44 w-full object-cover group-hover:scale-105 transition-transform duration-300" />
  </div>
  <div class="p-3">
    <p class="text-[10px] uppercase tracking-wide text-neutral-400 mb-1">{{book().categoryName}}</p>
    <h3
      class="text-sm font-medium text-neutral-800 leading-snug group-hover:text-[#02332D] transition-colors line-clamp-2">
      {{book().title}}</h3>
    <p class="text-xs text-neutral-400 mt-0.5">{{book().authorName}}</p>
    <div class="flex items-center justify-between mt-2">
      <span class="font-medium text-sm" style="color:#02332D">${{book().price}}</span>
      <span class="text-[10px] text-neutral-400">{{book().stock}} disp.</span>
    </div>
  </div>
</a>
