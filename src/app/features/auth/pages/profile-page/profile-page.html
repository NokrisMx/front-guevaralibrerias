@if (isLoading()) {
<div class="bg-neutral-50 min-h-screen">
  <div class="py-16 bg-primary">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-6">
      <div class="skeleton w-20 h-20 rounded-full"></div>
      <div class="space-y-3">
        <div class="skeleton h-3 w-24"></div>
        <div class="skeleton h-8 w-52"></div>
        <div class="skeleton h-3 w-36"></div>
      </div>
    </div>
  </div>
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-4">
    <div class="bg-white border border-neutral-100 rounded-sm p-6">
      <div class="flex justify-between mb-6">
        <div class="skeleton h-7 w-48"></div>
        <div class="skeleton h-9 w-24"></div>
      </div>
      <div class="grid sm:grid-cols-2 gap-5">
        @for (item of [1,2,3,4]; track item) {
        <div>
          <div class="skeleton h-3 w-28 mb-2"></div>
          <div class="skeleton h-11 w-full"></div>
        </div>
        }
      </div>
    </div>
  </div>
</div>

} @else if (user()) {
<div class="bg-neutral-50 min-h-screen">

  <!-- Hero -->
  <hero-profile-component [user]="user()!" />

  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid lg:grid-cols-3 gap-6">

      <!-- Columna izquierda -->
      <menu-profile-component />

      <!-- Columna derecha — formulario -->
      <div class="lg:col-span-2">
        <div class="bg-white border border-neutral-100 rounded-sm p-6">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 class="text-xl font-light text-primary" style="font-family:'Cormorant Garamond',serif;">
                Información Personal
              </h2>
              <p class="text-xs text-neutral-400 mt-0.5">Actualiza tus datos de perfil</p>
            </div>
            <button (click)="toggleEdit()" class="text-xs px-4 py-2 border transition-all"
              [style.background-color]="editing() ? 'transparent' : '#02332D'"
              [style.color]="editing() ? '#02332D' : 'white'" [style.border-color]="'#02332D'">
              {{ editing() ? 'Cancelar' : 'Editar' }}
            </button>
          </div>

          @if (successMsg()) {
          <div role="alert" class="alert alert-success mb-5 text-sm">
            <i class="pi pi-check-circle"></i>
            <span>{{ successMsg() }}</span>
          </div>
          }
          @if (errorMsg()) {
          <div role="alert" class="alert alert-error mb-5 text-sm">
            <i class="pi pi-times-circle"></i>
            <span>{{ errorMsg() }}</span>
          </div>
          }

          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Nombre Completo</label>
              <input type="text" [(ngModel)]="editableUser()!.name" [disabled]="!editing()"
                class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
                [class.border-neutral-200]="!editing()" [class.border-primary]="editing()">
            </div>
            <div>
              <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Nombre de Usuario</label>
              <input type="text" [(ngModel)]="editableUser()!.username" [disabled]="!editing()"
                class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
                [class.border-neutral-200]="!editing()" [class.border-primary]="editing()">
            </div>
            <div>
              <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Correo Electrónico</label>
              <input type="email" [(ngModel)]="editableUser()!.email" [disabled]="!editing()"
                class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
                [class.border-neutral-200]="!editing()" [class.border-primary]="editing()">
            </div>
            <div>
              <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Teléfono</label>
              <input type="tel" [(ngModel)]="editableUser()!.phoneNumber" [disabled]="!editing()"
                class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
                [class.border-neutral-200]="!editing()" [class.border-primary]="editing()">
            </div>
          </div>

          @if (editing()) {
          <div class="mt-6 pt-6 border-t border-neutral-100 flex justify-end gap-3">
            <button (click)="toggleEdit()"
              class="px-6 py-2.5 text-sm border border-neutral-200 text-neutral-500 hover:bg-neutral-50 transition-colors">
              Cancelar
            </button>
            <button (click)="save()"
              class="px-8 py-2.5 text-white text-sm font-medium hover:opacity-90 transition-opacity bg-primary">
              Guardar Cambios
            </button>
          </div>
          }
        </div>
      </div>

    </div>
  </div>
</div>
}
