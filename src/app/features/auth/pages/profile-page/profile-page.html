<div class="bg-neutral-50 min-h-screen">
  <div style="background-color:#02332D" class="py-10">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-5">
      <div class="w-14 h-14 rounded-full flex items-center justify-center text-[#02332D] font-medium text-lg"
        style="background-color:#b8975a">AG</div>
      <div>
        <p class="text-xs tracking-widest uppercase mb-1" style="color:#b8975a">Mi Cuenta</p>
        <h1 class="text-3xl font-light text-white" style="font-family:'Cormorant Garamond',serif">{{user().name}}</h1>
      </div>
    </div>
  </div>
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white border border-neutral-100 rounded-sm p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-light" style="font-family:'Cormorant Garamond',serif;color:#02332D">Información Personal
        </h2>
        <button (click)="toggleEdit()" class="text-xs px-4 py-2 border transition-colors"
          [style.background-color]="editing() ? 'transparent' : '#02332D'"
          [style.color]="editing() ? '#02332D' : 'white'" [style.border-color]="editing() ? '#02332D' : '#02332D'">
          {{editing() ? 'Cancelar' : 'Editar'}}
        </button>
      </div>
      @if (saved()) {
      <div class="mb-4 p-3 text-sm text-green-700 bg-green-50 border border-green-200 rounded-sm">✓ Cambios guardados
        correctamente</div>
      }
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Nombre Completo</label>
          <input type="text" [value]="user().name" [disabled]="!editing()"
            class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none focus:border-[#02332D] transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
            [class.border-neutral-200]="!editing()" [class.border-[#02332D]]="editing()">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Nombre de Usuario</label>
          <input type="text" [value]="user().username" [disabled]="!editing()"
            class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none focus:border-[#02332D] transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
            [class.border-neutral-200]="!editing()" [class.border-[#02332D]]="editing()">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Correo Electrónico</label>
          <input type="email" [value]="user().email" [disabled]="!editing()"
            class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none focus:border-[#02332D] transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
            [class.border-neutral-200]="!editing()" [class.border-[#02332D]]="editing()">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Teléfono</label>
          <input type="tel" [value]="user().phone" [disabled]="!editing()"
            class="w-full border px-4 py-2.5 text-sm rounded-sm focus:outline-none focus:border-[#02332D] transition-colors disabled:bg-neutral-50 disabled:text-neutral-500"
            [class.border-neutral-200]="!editing()" [class.border-[#02332D]]="editing()">
        </div>
      </div>
      @if (editing()) {
      <div class="mt-6 pt-6 border-t border-neutral-100 flex justify-end">
        <button (click)="save()" class="px-8 py-3 text-white text-sm font-medium"
          style="background-color:#02332D">Guardar Cambios</button>
      </div>
      }
    </div>
    <div class="grid sm:grid-cols-2 gap-4 mt-6">
      <a routerLink="/auth/orders"
        class="bg-white border border-neutral-100 rounded-sm p-5 hover:shadow-md transition-all flex items-center gap-3">
        <span class="text-2xl">📦</span>
        <div>
          <p class="font-medium text-sm text-neutral-700">Mis Pedidos</p>
          <p class="text-xs text-neutral-400">Ver historial</p>
        </div>
      </a>
      <a routerLink="/login"
        class="bg-white border border-neutral-100 rounded-sm p-5 hover:shadow-md transition-all flex items-center gap-3">
        <span class="text-2xl">🚪</span>
        <div>
          <p class="font-medium text-sm text-red-500">Cerrar Sesión</p>
          <p class="text-xs text-neutral-400">Salir de tu cuenta</p>
        </div>
      </a>
    </div>
  </div>
</div>
