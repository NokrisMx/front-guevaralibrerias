<div class="min-h-screen flex bg-primary">
  <div class="hidden lg:flex lg:w-1/2 items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 opacity-5"
      style="background-image:repeating-linear-gradient(45deg,#b8975a 0,#b8975a 1px,transparent 0,transparent 30px);background-size:30px 30px">
    </div>
    <div class="text-center relative z-10">
      <h1 class="text-6xl font-light text-white leading-none"
        style="font-family:'Cormorant Garamond',serif;font-style:italic">Guevara<br><span
          style="color:#b8975a">Librerías</span></h1>
      <p class="text-white/40 text-sm mt-4 tracking-widest uppercase">Tu mundo literario</p>
    </div>
  </div>
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white">
    <div class="w-full max-w-md">
      <p class="text-xs tracking-widest uppercase mb-2" style="color:#b8975a">Bienvenido</p>
      <h2 class="text-3xl font-light mb-8 text-primary" style="font-family:'Cormorant Garamond',serif;">Iniciar Sesión
      </h2>
      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Correo Electrónico</label>
          <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email"
            class="w-full border border-neutral-200 px-4 py-3 text-sm rounded-sm focus:outline-none focus:border-primary transition-colors"
            placeholder="tu@correo.com">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-neutral-400 mb-2">Contraseña</label>
          <div class="relative">
            <input [type]="showPass() ? 'text' : 'password'" [ngModel]="password()"
              (ngModelChange)="password.set($event)" name="pass" minlength="8" required
              pattern="(?=.*\\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
              title="Debe tener mínimo 8 caracteres, una mayúscula, una minúscula y un número" class="w-full border border-neutral-200 px-4 py-3 text-sm rounded-sm
           focus:outline-none focus:border-primary
           transition-colors pr-12" placeholder="••••••••">

            <button type="button" (click)="showPass.update(v => !v)"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-700 transition-colors">

              <i [class]="showPass() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>

            </button>
          </div>

        </div>
        <!--
        <div class="flex justify-end">
          <a href="#" class="text-xs text-neutral-400 hover:text-[#02332D]">¿Olvidaste tu contraseña?</a>
        </div>
        -->
        @if (errorMsg()) {
        <div role="alert" class="alert alert-error text-sm">

          <i class="pi pi-exclamation-triangle"></i>

          <span>{{ errorMsg() }}</span>

        </div>
        }
        <button type="submit" [disabled]="isLoading()"
          class="w-full py-3 text-white text-sm font-medium tracking-wide transition-opacity hover:opacity-90 bg-primary">
          {{ isLoading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>
      </form>
      <p class="text-center text-sm text-neutral-400 mt-6">¿No tienes cuenta? <a routerLink="/auth/register"
          class="font-medium hover:opacity-70 transition-opacity text-primary">Regístrate</a></p>
    </div>
  </div>
</div>
