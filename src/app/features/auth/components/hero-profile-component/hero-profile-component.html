<div class="relative overflow-hidden py-16 bg-primary">
  <div class="absolute -top-20 -right-20 w-80 h-80 rounded-full opacity-5"
    style="background:radial-gradient(circle, #b8975a, transparent)"></div>
  <div class="absolute -bottom-20 -left-20 w-80 h-80 rounded-full opacity-5"
    style="background:radial-gradient(circle, #b8975a, transparent)"></div>

  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6">

      <!-- Avatar -->
      <div class="w-20 h-20 rounded-full flex items-center justify-center text-2xl font-light shrink-0 text-primary"
        style="background-color:#b8975a; font-family:'Cormorant Garamond',serif">
        {{ user()!.name.charAt(0).toUpperCase() }}
      </div>

      <div class="flex-1">
        <p class="text-xs tracking-widest uppercase mb-1" style="color:#b8975a">Mi Cuenta</p>
        <h1 class="text-4xl font-light text-white mb-1"
          style="font-family:'Cormorant Garamond',serif; font-style:italic">
          {{ user()!.name }}
        </h1>
      </div>

    </div>
  </div>
</div>
